<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>ISCGB — Gestión Documental y Autogestión Académica</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Sistema de gestión documental y autogestión académica del Instituto Superior Cura Gabriel Brochero."
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!--
      Tipografías institucionales.
      Gasoek One → títulos · Geist → contenido · Geist Mono → piezas digitales.

      `preconnect` le avisa al navegador que abra la conexión con Google Fonts
      antes de necesitarla; ahorra unos cuantos milisegundos.
      `display=swap` muestra el texto con la fuente de respaldo mientras la
      definitiva descarga, en vez de dejar el texto invisible.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gasoek+One&family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap"
      rel="stylesheet"
    />

    <!--
      Pantalla de arranque.

      Todo lo de acá abajo está escrito directo en el HTML, sin Angular y sin
      Tailwind, a propósito: se ve desde el primer instante, antes de que el
      navegador termine de descargar la aplicación. Si dependiera de Angular,
      el usuario miraría una pantalla en blanco hasta que Angular arranque,
      que es justo el rato que queremos cubrir.

      Cuando Angular arranca, reemplaza todo lo que haya dentro de <app-root>,
      así que este bloque desaparece solo. No hay que borrarlo por código.
    -->
    <style>
      .arranque {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        height: 100dvh;
        background: #f5f5f5;
        font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      .arranque svg {
        width: 5rem;
        height: 5rem;
      }

      .arranque path {
        fill: #46695f;
        stroke: #46695f;
        stroke-width: 1.5;
        stroke-dasharray: 537;
        animation: arranque-dibujar 2.6s ease-in-out infinite;
      }

      .arranque p {
        margin: 0;
        font-size: 0.875rem;
        letter-spacing: 0.04em;
        color: #666e6b;
      }

      @keyframes arranque-dibujar {
        0% {
          stroke-dashoffset: 537;
          fill-opacity: 0;
        }
        50% {
          stroke-dashoffset: 0;
          fill-opacity: 0;
        }
        68% {
          fill-opacity: 1;
        }
        85% {
          stroke-dashoffset: 0;
          fill-opacity: 1;
        }
        100% {
          stroke-dashoffset: -537;
          fill-opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .arranque path {
          stroke: none;
          stroke-dasharray: none;
          animation: arranque-respirar 2s ease-in-out infinite;
        }

        @keyframes arranque-respirar {
          0%,
          100% {
            fill-opacity: 0.45;
          }
          50% {
            fill-opacity: 1;
          }
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="arranque" role="status" aria-live="polite">
        <svg viewBox="0 0 62 58" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

        <p>Cargando ISCGB…</p>
      </div>
    </app-root>
  </body>
</html>
