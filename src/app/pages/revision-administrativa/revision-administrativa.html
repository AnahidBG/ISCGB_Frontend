<div class="page-layout">
  <!-- Sidebar dinámico unificado -->
  <app-sidebar [menuItems]="menuItems"></app-sidebar>

  <!-- Contenido Principal -->
  <div class="main-wrapper">
    <!-- Header Superior -->
    <header class="top-bar">
      <div class="user-notifications">
        <button class="btn-bell" title="Notificaciones">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span class="badge-dot"></span>
        </button>
        <div class="divider"></div>
        <div class="user-profile">
          <div class="user-info">
            <span class="user-name">Usuario</span>
            <span class="user-role">Rol Usuario</span>
          </div>
          <img class="user-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Secretario" alt="Avatar Secretario">
        </div>
      </div>
    </header>

    <!-- Sección de Revisión -->
    <div class="revision-container">
      <!-- Columna Izquierda: Lista de Documentos -->
      <aside class="docs-sidebar">
        <div class="search-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" placeholder="Buscar docente o archivo..." [(ngModel)]="busqueda">
        </div>

        <div class="tabs-container">
          <button [class.active]="filtroTab === 'pendientes'" (click)="filtroTab = 'pendientes'">Pendientes</button>
          <button [class.active]="filtroTab === 'historial'" (click)="filtroTab = 'historial'">Historial</button>
        </div>

        <div class="docs-list">
          <div 
            class="doc-card" 
            *ngFor="let doc of documentos" 
            [class.selected]="doc.id === docSeleccionado.id"
            (click)="seleccionarDoc(doc)">
            <div class="doc-header">
              <span class="doc-profesor">{{ doc.docente }}</span>
              <span class="doc-fecha">{{ doc.fecha }}</span>
            </div>
            <p class="doc-archivo">{{ doc.archivo }}</p>
            <div class="doc-footer">
              <span class="badge-categoria">{{ doc.categoria }}</span>
              <span class="status-dot"></span>
            </div>
          </div>
        </div>
      </aside>

      <!-- Columna Derecha: Visor y Acciones -->
      <main class="doc-viewer-container">
        <header class="viewer-header">
          <div class="viewer-title-info">
            <h2>{{ docSeleccionado.archivo }}</h2>
            <p>Subido por <strong>{{ docSeleccionado.docente }}</strong> el {{ docSeleccionado.fecha }}</p>
          </div>
          <button class="btn-download" title="Descargar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
          </button>
        </header>

        <div class="pdf-preview-box">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#688075" stroke-width="1.5">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <span>Vista previa del documento PDF</span>
        </div>

        <footer class="audit-section">
          <label for="comentarios">Comentarios para el docente (opcional)</label>
          <textarea 
            id="comentarios" 
            rows="3" 
            [(ngModel)]="comentario" 
            placeholder="Indique si hay algún problema con la documentación..."></textarea>

          <div class="audit-actions">
            <button class="btn-rechazar">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="15" y1="9" x2="9" y2="15"></line>
                <line x1="9" y1="9" x2="15" y2="15"></line>
              </svg>
              Rechazar
            </button>
            <button class="btn-aprobar">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="9 11 12 14 16 10"></polyline>
              </svg>
              Aprobar Documento
            </button>
          </div>
        </footer>
      </main>
    </div>
  </div>
</div>
