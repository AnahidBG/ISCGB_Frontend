<div class="layout-wrapper">

  <!-- Sidebar Lateral Unificado -->
  <app-sidebar [menuItems]="menuItems"></app-sidebar>

  <!-- Contenido Principal -->
  <main class="main-content">

    <!-- Header Superior -->
    <header class="top-bar">
      <div class="user-notifications">
        <button class="btn-bell" title="Notificaciones">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span class="badge-dot"></span>
        </button>
        <div class="divider"></div>
        <div class="user-profile">
          <div class="user-info">
            <span class="user-name">Secretario</span>
            <span class="user-role">Secretario</span>
          </div>
          <img class="user-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Secretario"
            alt="Avatar Secretario">
        </div>
      </div>
    </header>

    <div class="content-body">
      <section class="section-header">
        <h2>Control de Legajos</h2>
        <p class="subtitle">Gestión y estado de documentación entregada por los docentes.</p>
      </section>

      <div class="legajos-list">
        <div class="legajo-card" *ngFor="let docente of docentes">

          <div class="avatar-circle" [ngClass]="docente.estado === 'Completo' ? 'avatar-completo' : 'avatar-proceso'">
            {{ docente.iniciales }}
          </div>

          <div class="docente-info">
            <h3 class="nombre">{{ docente.nombre }} <span class="dni">• {{ docente.dni }}</span></h3>
            <p class="materia">{{ docente.materia }}</p>
          </div>

          <div class="progreso-section">
            <ng-container *ngIf="docente.estado === 'Completo'; else progresoIncompleto">
              <span class="badge-completo">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <g clip-path="url(#clip0_16_4729)">
                    <path
                      d="M16.3509 7.50011C16.6935 9.18109 16.4494 10.9287 15.6593 12.4515C14.8693 13.9742 13.5811 15.1802 12.0096 15.8681C10.438 16.5561 8.67817 16.6845 7.02342 16.2319C5.36868 15.7793 3.91909 14.7732 2.9164 13.3812C1.91372 11.9892 1.41854 10.2955 1.51344 8.58265C1.60835 6.86977 2.28761 5.24118 3.43793 3.96849C4.58826 2.6958 6.14013 1.85594 7.83475 1.58895C9.52936 1.32197 11.2643 1.64401 12.7502 2.50136"
                      stroke="#4CAF50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M6.75 8.25L9 10.5L16.5 3" stroke="#4CAF50" stroke-width="1.5" stroke-linecap="round"
                      stroke-linejoin="round" />
                  </g>
                  <defs>
                    <clipPath id="clip0_16_4729">
                      <rect width="18" height="18" fill="white" />
                    </clipPath>
                  </defs>
                </svg>
                Completo
              </span>
            </ng-container>

            <ng-template #progresoIncompleto>
              <div class="bar-container">
                <div class="label-group">
                  <span class="progreso-label">Progreso</span>
                  <span class="porcentaje-label">{{ docente.progreso }}%</span>
                </div>
                <div class="progress-bar">
                  <div class="progress-fill" [style.width.%]="docente.progreso"></div>
                </div>
              </div>
            </ng-template>
          </div>

          <div class="accion-section">
            <button class="btn-revisar" (click)="revisarLegajo(docente.idDocente)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              Revisar
            </button>
          </div>

        </div>
      </div>
    </div>
  </main>

</div>
