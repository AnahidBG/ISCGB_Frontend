<div class="control-legajos-container">
  
  <header class="section-header">
    <h2>Control de Legajos</h2>
    <p class="subtitle">Gestión y estado de documentación entregada por los docentes.</p>
  </header>

  <div class="legajos-list">
    <div class="legajo-card" *ngFor="let docente of docentes">
      
      <!-- Avatar con color dinámico -->
      <div class="avatar-circle" [ngClass]="docente.estado === 'Completo' ? 'avatar-completo' : 'avatar-proceso'">
        {{ docente.iniciales }}
      </div>

      <!-- Información del Docente -->
      <div class="docente-info">
        <h3 class="nombre">{{ docente.nombre }} <span class="dni">• {{ docente.dni }}</span></h3>
        <p class="materia">{{ docente.materia }}</p>
      </div>

      <!-- Barra / Estado -->
      <div class="progreso-section">
        <ng-container *ngIf="docente.estado === 'Completo'; else progresoIncompleto">
          <span class="badge-completo">
            <i class="bi bi-check-circle"></i> Completo
          </span>
        </ng-container>

        <ng-template #progresoIncompleto>
          <div class="bar-container">
            <div class="label-group">
              <span class="progreso-label">Progreso</span>
              <span class="porcentaje-label">{{ docente.progreso }}%</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" [style.width.%]="docente.progreso"></div>
            </div>
          </div>
        </ng-template>
      </div>

      <!-- Botón Revisar con Ícono -->
      <div class="accion-section">
        <button class="btn-revisar" (click)="revisarLegajo(docente.idDocente)">
          <i class="bi bi-eye"></i> Revisar
        </button>
      </div>

    </div>
  </div>

</div>
