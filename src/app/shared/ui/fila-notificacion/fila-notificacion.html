<!--
  Con `url` la fila lleva a algún lado; sin `url` es solo el aviso. Las dos
  ramas se dibujan igual para que la lista se lea pareja.
-->
<div class="flex items-start gap-2 px-4 py-3 hover:bg-fondo-panel">
  @if (notificacion().url; as destino) {
    <a
      [attr.role]="rolEnlace()"
      [routerLink]="destino"
      class="flex min-w-0 flex-1 gap-3 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-principal"
      (click)="seleccionada.emit()"
    >
      <ng-container *ngTemplateOutlet="contenido" />
    </a>
  } @else {
    <div class="flex min-w-0 flex-1 gap-3">
      <ng-container *ngTemplateOutlet="contenido" />
    </div>
  }

  <button
    type="button"
    class="shrink-0 rounded p-1 text-texto-suave transition-colors hover:bg-fondo-panel hover:text-texto focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-principal"
    [attr.aria-label]="'Descartar notificación: ' + notificacion().titulo"
    (click)="eliminada.emit(notificacion())"
  >
    <span aria-hidden="true" class="block text-lg font-medium leading-none">×</span>
  </button>
</div>

<ng-template #contenido>
  <span
    aria-hidden="true"
    class="mt-1.5 h-2 w-2 shrink-0 rounded-full"
    [class]="clasePunto()"
  ></span>
  <span class="min-w-0">
    <span class="block text-sm font-medium text-texto">{{ notificacion().titulo }}</span>
    @if (notificacion().detalle; as detalle) {
      <span class="mt-0.5 block text-xs text-texto-suave">{{ detalle }}</span>
    }
  </span>
</ng-template>
