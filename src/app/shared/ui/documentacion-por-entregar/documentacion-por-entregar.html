<section
  aria-labelledby="titulo-por-entregar"
  class="rounded-2xl border border-pendiente/30 bg-superficie"
>
  <header class="flex items-center justify-between gap-3 border-b border-borde px-5 py-4 sm:px-6">
    <div class="flex min-w-0 items-center gap-3">
      <app-icono nombre="alerta" class="h-5 w-5 shrink-0 text-pendiente" />
      <h2 id="titulo-por-entregar" class="text-lg font-bold text-principal">
        Documentación por entregar
      </h2>
    </div>
    <span
      class="shrink-0 rounded-full bg-pendiente/10 px-2.5 py-0.5 text-xs font-semibold text-pendiente"
    >
      {{ documentos().length }}
    </span>
  </header>

  <ul class="divide-y divide-borde">
    @for (fila of filas(); track fila.documento.idTipoDoc) {
      <li class="flex items-center justify-between gap-3 px-5 py-3 sm:px-6">
        <span class="min-w-0 truncate text-sm font-medium text-texto">
          {{ fila.documento.nombreDocumento }}
        </span>
        <a
          routerLink="/legajo/subir-documento"
          [queryParams]="fila.consulta"
          [attr.aria-label]="'Subir ' + fila.documento.nombreDocumento"
          class="inline-flex shrink-0 items-center gap-1.5 rounded-full border border-principal/30 px-3 py-1 text-xs font-semibold text-principal transition-colors hover:bg-principal/10 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-principal"
        >
          <app-icono nombre="subir" class="h-3.5 w-3.5" />
          Subir
        </a>
      </li>
    }
  </ul>

  <p class="border-t border-borde px-5 py-3 text-xs leading-relaxed text-texto-suave sm:px-6">
    {{ indicacion() }}
  </p>
</section>
