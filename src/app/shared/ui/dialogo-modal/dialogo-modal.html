<!--
  El fondo oscuro cubre toda la pantalla y scrollea si el diálogo no entra
  (celular en horizontal, teclado abierto). No cierra al tocarlo: ver el
  comentario del componente.
-->
<div class="fixed inset-0 z-50 overflow-y-auto bg-texto/50">
  <div class="flex min-h-full items-center justify-center p-4">
    <div
      #panel
      role="dialog"
      aria-modal="true"
      tabindex="-1"
      [attr.aria-labelledby]="idTitulo"
      class="w-full max-w-lg rounded-xl border border-borde bg-superficie shadow-marca-lg focus:outline-none"
      (keydown)="alTeclear($event)"
    >
      <div class="flex items-start justify-between gap-4 px-5 pt-5 sm:px-6 sm:pt-6">
        <div class="min-w-0">
          <h2 [id]="idTitulo" class="text-lg font-bold text-texto">{{ titulo() }}</h2>
          @if (subtitulo(); as texto) {
            <p class="mt-1 text-sm text-texto-suave">{{ texto }}</p>
          }
        </div>

        <button
          type="button"
          aria-label="Cerrar"
          [disabled]="bloqueado()"
          class="shrink-0 rounded-lg border border-borde p-2 text-texto-suave transition-colors hover:bg-fondo-panel hover:text-texto focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-principal disabled:cursor-not-allowed disabled:opacity-40"
          (click)="pedirCierre()"
        >
          <app-icono nombre="cerrar" class="h-4 w-4" />
        </button>
      </div>

      <div class="px-5 pb-5 pt-4 sm:px-6 sm:pb-6">
        <ng-content />
      </div>
    </div>
  </div>
</div>
