<div class="flex items-center gap-4 rounded-2xl border border-borde bg-superficie px-5 py-5">
  <span
    class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full"
    [class]="apariencia().burbuja"
  >
    <app-icono [nombre]="apariencia().icono" class="h-6 w-6" />
  </span>

  <div class="flex flex-col leading-tight">
    <span class="text-sm text-texto-suave">{{ etiqueta() }}</span>
    <span class="mt-1 text-3xl font-bold" [class]="apariencia().numero">{{ valor() }}</span>
  </div>
</div>
