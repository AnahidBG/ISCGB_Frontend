<div class="rounded-xl bg-fondo-panel px-3 py-2.5">
  <p class="text-xs font-medium text-texto-suave">
    La contraseña tiene que tener: {{ cumplidos() }}/{{ requisitos().length }}
  </p>

  <ul class="mt-1.5 flex flex-col gap-1">
    @for (requisito of requisitos(); track requisito.clave) {
      <li
        class="flex items-center gap-2 text-xs"
        [class.text-aprobado]="requisito.cumple"
        [class.text-texto-suave]="!requisito.cumple"
      >
        <!--
          El tilde y el círculo son decorativos: el estado real se lee del
          texto que los acompaña, así que van con aria-hidden y el li lleva su
          propia etiqueta para el lector de pantalla.
        -->
        @if (requisito.cumple) {
          <svg viewBox="0 0 16 16" class="h-3.5 w-3.5 shrink-0" aria-hidden="true">
            <path
              d="m3.5 8.5 3 3 6-7"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        } @else {
          <svg viewBox="0 0 16 16" class="h-3.5 w-3.5 shrink-0" aria-hidden="true">
            <circle cx="8" cy="8" r="3" fill="currentColor" opacity="0.4" />
          </svg>
        }

        <span>
          {{ requisito.texto }}
          <span class="sr-only">
            @if (requisito.cumple) {
              (cumplido)
            } @else {
              (todavía no)
            }
          </span>
        </span>
      </li>
    }
  </ul>
</div>
