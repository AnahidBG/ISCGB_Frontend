<svg
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.75"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
>
  @switch (nombre()) {
    @case ('panel') {
      <!-- Grilla 2x2 desalineada: dashboard / vista general. -->
      <rect x="3" y="3" width="7" height="9" rx="1.5" />
      <rect x="14" y="3" width="7" height="5" rx="1.5" />
      <rect x="14" y="12" width="7" height="9" rx="1.5" />
      <rect x="3" y="16" width="7" height="5" rx="1.5" />
    }
    @case ('usuarios') {
      <circle cx="9" cy="8" r="3" />
      <path d="M3.5 20a5.5 5.5 0 0 1 11 0" />
      <path d="M16 11a3 3 0 0 0 0-6" />
      <path d="M17 15.5a5.5 5.5 0 0 1 3.5 4.5" />
    }
    @case ('documento') {
      <!-- Hoja con la esquina doblada: documento suelto. -->
      <path d="M7 3h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" />
      <path d="M14 3v4h4" />
      <path d="M9 13.5h6" />
      <path d="M9 17h6" />
    }
    @case ('legajo') {
      <!-- Carpeta: el legajo como conjunto de documentos. -->
      <path
        d="M3.5 6.5A1.5 1.5 0 0 1 5 5h4.4l1.8 2h8.3a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5Z"
      />
    }
    @case ('subir') {
      <!-- Flecha hacia una bandeja: subir un archivo. -->
      <path d="M12 15.5V4" />
      <path d="m7.5 8.5 4.5-4.5 4.5 4.5" />
      <path d="M4 15.5v3.75A1.75 1.75 0 0 0 5.75 21h12.5A1.75 1.75 0 0 0 20 19.25V15.5" />
    }
    @case ('salir') {
      <!-- Puerta con flecha: cerrar sesión. -->
      <path d="M9 21H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h4" />
      <path d="m16 17 5-5-5-5" />
      <path d="M21 12H9" />
    }
    @case ('menu') {
      <!-- Hamburguesa: abrir el menú en celular. -->
      <path d="M4 6h16M4 12h16M4 18h16" />
    }
    @case ('buscar') {
      <!-- Lupa: buscador del encabezado. -->
      <circle cx="10.5" cy="10.5" r="6.5" />
      <path d="m20 20-4.35-4.35" />
    }
    @case ('campana') {
      <!-- Campana: notificaciones. -->
      <path d="M6 9a6 6 0 0 1 12 0c0 4.5 1.5 6 1.5 6h-15S6 13.5 6 9Z" />
      <path d="M10 19a2 2 0 0 0 4 0" />
    }
    @case ('revision') {
      <!-- Lápiz: editar. -->
      <path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5.5 16Z" />
      <path d="m14 6.5 3 3" />
    }
    @case ('aprobado') {
      <!-- Tilde en círculo: estado Aprobado del semáforo. -->
      <circle cx="12" cy="12" r="8.5" />
      <path d="m8.5 12.3 2.4 2.4 4.6-5.4" />
    }
    @case ('pendiente') {
      <!-- Reloj de arena: estado Pendiente del semáforo. -->
      <path d="M7 3.5h10M7 20.5h10" />
      <path d="M8 3.5v3.2a4 4 0 0 0 1.6 3.2l1.6 1.2-1.6 1.2A4 4 0 0 0 8 16.5v3.2" />
      <path d="M16 3.5v3.2a4 4 0 0 1-1.6 3.2L12.8 11l1.6 1.2a4 4 0 0 1 1.6 3.2v3.2" />
    }
    @case ('rechazado') {
      <!-- Equis en círculo: estado Rechazado del semáforo. -->
      <circle cx="12" cy="12" r="8.5" />
      <path d="m9.3 9.3 5.4 5.4M14.7 9.3l-5.4 5.4" />
    }
    @case ('reloj') {
      <!-- Reloj simple: marca de tiempo ("Subido el..."). -->
      <circle cx="12" cy="12" r="8.5" />
      <path d="M12 7.5V12l3 2" />
    }
    @case ('colapsar') {
      <!-- Chevron simple: se rota con CSS según el estado. -->
      <path d="m15 6-6 6 6 6" />
    }
    @case ('volver') {
      <!-- Flecha hacia la izquierda: "volver" a la pantalla anterior. -->
      <path d="M19 12H5" />
      <path d="m11 18-6-6 6-6" />
    }
    @case ('calendario') {
      <!-- Calendario: mesas de examen y fechas importantes. -->
      <rect x="3.5" y="5" width="17" height="15.5" rx="2" />
      <path d="M8 3v4M16 3v4M3.5 10h17" />
    }
    @case ('configuracion') {
      <!-- Engranaje: configuración / ajustes de la cuenta. -->
      <circle cx="12" cy="12" r="3" />
      <path
        d="M12 3.5v2M12 18.5v2M20.5 12h-2M5.5 12h-2M17.8 6.2l-1.4 1.4M7.6 16.4l-1.4 1.4M17.8 17.8l-1.4-1.4M7.6 7.6 6.2 6.2"
      />
    }
  }
</svg>
