<svg
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.75"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
>
  @switch (nombre()) {
    @case ('panel') {
      <!-- Grilla 2x2 desalineada: dashboard / vista general. -->
      <rect x="3" y="3" width="7" height="9" rx="1.5" />
      <rect x="14" y="3" width="7" height="5" rx="1.5" />
      <rect x="14" y="12" width="7" height="9" rx="1.5" />
      <rect x="3" y="16" width="7" height="5" rx="1.5" />
    }
    @case ('usuarios') {
      <circle cx="9" cy="8" r="3" />
      <path d="M3.5 20a5.5 5.5 0 0 1 11 0" />
      <path d="M16 11a3 3 0 0 0 0-6" />
      <path d="M17 15.5a5.5 5.5 0 0 1 3.5 4.5" />
    }
    @case ('documento') {
      <!-- Hoja con la esquina doblada: documento suelto. -->
      <path d="M7 3h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" />
      <path d="M14 3v4h4" />
      <path d="M9 13.5h6" />
      <path d="M9 17h6" />
    }
    @case ('legajo') {
      <!-- Carpeta: el legajo como conjunto de documentos. -->
      <path
        d="M3.5 6.5A1.5 1.5 0 0 1 5 5h4.4l1.8 2h8.3a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5Z"
      />
    }
    @case ('subir') {
      <!-- Flecha hacia una bandeja: subir un archivo. -->
      <path d="M12 15.5V4" />
      <path d="m7.5 8.5 4.5-4.5 4.5 4.5" />
      <path d="M4 15.5v3.75A1.75 1.75 0 0 0 5.75 21h12.5A1.75 1.75 0 0 0 20 19.25V15.5" />
    }
    @case ('salir') {
      <!-- Puerta con flecha: cerrar sesión. -->
      <path d="M9 21H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h4" />
      <path d="m16 17 5-5-5-5" />
      <path d="M21 12H9" />
    }
    @case ('menu') {
      <!-- Hamburguesa: abrir el menú en celular. -->
      <path d="M4 6h16M4 12h16M4 18h16" />
    }
    @case ('buscar') {
      <!-- Lupa: buscador del encabezado. -->
      <circle cx="10.5" cy="10.5" r="6.5" />
      <path d="m20 20-4.35-4.35" />
    }
    @case ('campana') {
      <!-- Campana: notificaciones. -->
      <path d="M6 9a6 6 0 0 1 12 0c0 4.5 1.5 6 1.5 6h-15S6 13.5 6 9Z" />
      <path d="M10 19a2 2 0 0 0 4 0" />
    }
    @case ('revision') {
      <!-- Lápiz: editar. -->
      <path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5.5 16Z" />
      <path d="m14 6.5 3 3" />
    }
    @case ('aprobado') {
      <!-- Tilde en círculo: estado Aprobado del semáforo. -->
      <circle cx="12" cy="12" r="8.5" />
      <path d="m8.5 12.3 2.4 2.4 4.6-5.4" />
    }
    @case ('pendiente') {
      <!-- Reloj de arena: estado Pendiente del semáforo. -->
      <path d="M7 3.5h10M7 20.5h10" />
      <path d="M8 3.5v3.2a4 4 0 0 0 1.6 3.2l1.6 1.2-1.6 1.2A4 4 0 0 0 8 16.5v3.2" />
      <path d="M16 3.5v3.2a4 4 0 0 1-1.6 3.2L12.8 11l1.6 1.2a4 4 0 0 1 1.6 3.2v3.2" />
    }
    @case ('rechazado') {
      <!-- Equis en círculo: estado Rechazado del semáforo. -->
      <circle cx="12" cy="12" r="8.5" />
      <path d="m9.3 9.3 5.4 5.4M14.7 9.3l-5.4 5.4" />
    }
    @case ('reloj') {
      <!-- Reloj simple: marca de tiempo ("Subido el..."). -->
      <circle cx="12" cy="12" r="8.5" />
      <path d="M12 7.5V12l3 2" />
    }
    @case ('colapsar') {
      <!-- Chevron simple: se rota con CSS según el estado. -->
      <path d="m15 6-6 6 6 6" />
    }
    @case ('volver') {
      <!-- Flecha hacia la izquierda: "volver" a la pantalla anterior. -->
      <path d="M19 12H5" />
      <path d="m11 18-6-6 6-6" />
    }
    @case ('calendario') {
      <!-- Calendario: mesas de examen y fechas importantes. -->
      <rect x="3.5" y="5" width="17" height="15.5" rx="2" />
      <path d="M8 3v4M16 3v4M3.5 10h17" />
    }
    @case ('configuracion') {
      <!--
        Engranaje: configuración / ajustes de la cuenta.

        Es `cog-6-tooth` (outline) de Heroicons, el set que hace el equipo de
        Tailwind. Ojo: Tailwind en sí NO trae íconos — es solo CSS; los
        íconos son este proyecto aparte, del mismo equipo.

        Está copiado como path en vez de instalar nada: es un solo ícono y
        Heroicons es MIT, así que copiarlo está permitido.
        https://heroicons.com (cog-6-tooth, outline)

        Encaja sin tocarle nada porque Heroicons outline se dibuja igual que
        este set: trazo sobre `viewBox="0 0 24 24"`, `currentColor`, puntas
        redondeadas. Lo único que cambia es el grosor — Heroicons viene a
        1.5 y acá hereda el 1.75 del `<svg>` de arriba, que es lo que hace
        que no desentone con sus vecinos del menú.

        (Antes acá hubo dos versiones: una dibujada a mano que parecía un
        sol, y el `setting` de Ant Design, que era de relleno y necesitaba
        reescalado. Esta no necesita ni una cosa ni la otra.)
      -->
      <path
        d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.077-.124.072-.044.146-.087.22-.128.331-.183.581-.495.644-.869l.213-1.281z"
      />
      <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
    }
    @case ('tabla') {
      <!-- Tabla: filas y columnas — la vista "Vista del Panel · Tabla". -->
      <rect x="3" y="4.5" width="18" height="15" rx="1.5" />
      <path d="M3 9.5h18M9.5 9.5v10" />
    }
    @case ('tarjetas') {
      <!-- Grilla simétrica de tarjetas — la vista "Vista del Panel · Cards". -->
      <rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.5" />
      <rect x="13" y="3.5" width="7.5" height="7.5" rx="1.5" />
      <rect x="3.5" y="13" width="7.5" height="7.5" rx="1.5" />
      <rect x="13" y="13" width="7.5" height="7.5" rx="1.5" />
    }
    @case ('cerrar') {
      <!-- Equis: cerrar el menú desplegable de celular. -->
      <path d="M6 6l12 12M18 6 6 18" />
    }
    @case ('alerta') {
      <!--
        Signo de exclamación en triángulo: recordatorio que la persona tiene
        que hacer fuera del sistema (presentar el papel en Secretaría).
      -->
      <path d="M12 4.5 21 19.5H3Z" />
      <path d="M12 10v4" />
      <path d="M12 16.8h.01" />
    }
    @case ('compacto') {
      <!--
        Lista densa: un punto + una línea de texto por fila (distinto del
        hamburguesa de 'menu', que son tres barras iguales de lado a lado) —
        la vista "Vista del Panel · Compacto".
      -->
      <circle cx="4.5" cy="6.5" r="1.1" fill="currentColor" stroke="none" />
      <circle cx="4.5" cy="12" r="1.1" fill="currentColor" stroke="none" />
      <circle cx="4.5" cy="17.5" r="1.1" fill="currentColor" stroke="none" />
      <path d="M8.5 6.5h11M8.5 12h11M8.5 17.5h7" />
    }
  }
</svg>
