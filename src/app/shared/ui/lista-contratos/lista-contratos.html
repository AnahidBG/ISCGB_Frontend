<ul class="divide-y divide-borde">
  @for (contrato of contratos(); track contrato.idContrato) {
    <li class="flex items-center justify-between gap-3 py-3 first:pt-0 last:pb-0">
      <div class="flex min-w-0 items-center gap-3">
        <span
          class="hidden h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-fondo-panel text-texto-suave sm:flex"
        >
          <app-icono nombre="documento" class="h-5 w-5" />
        </span>
        <div class="min-w-0">
          <p class="truncate text-sm font-medium text-texto">{{ contrato.nombre }}</p>
          <p class="mt-0.5 text-xs text-texto-suave">
            Cargado el {{ contrato.fechaCarga | date: 'dd/MM/yyyy' }}
          </p>
        </div>
      </div>

      <button
        type="button"
        class="shrink-0 rounded-md px-2 py-1 text-sm font-medium text-principal hover:underline disabled:text-texto-suave disabled:no-underline"
        [disabled]="descargando() === contrato.idContrato"
        [attr.aria-label]="'Descargar ' + contrato.nombre"
        (click)="descargar.emit(contrato)"
      >
        {{ descargando() === contrato.idContrato ? 'Descargando…' : 'Descargar' }}
      </button>
    </li>
  } @empty {
    <li class="text-sm text-texto-suave">{{ textoVacio() }}</li>
  }
</ul>
