<div class="flex items-start justify-between gap-0.5 sm:gap-1">
  <span class="text-sm leading-5 sm:text-base" [class]="claseNumero()">
    {{ dia().numero }}
  </span>

  @if (apariencia().candado) {
    <app-icono nombre="candado" class="h-3 w-3 shrink-0 text-rechazado sm:h-4 sm:w-4" />
  }
</div>

@if (dia().delMes) {
  <!--
    La etiqueta se ve desde `sm`. Antes la celda no tiene lugar: quedan la
    barrita, la cantidad en número y el candado, que distinguen los tres estados
    sin depender solo del color. La etiqueta sigue ahí para los lectores de pantalla.
  -->
  <div class="mt-1 flex items-center gap-1.5">
    <span
      class="h-3 w-1 shrink-0 rounded-full"
      [class]="apariencia().marca"
      aria-hidden="true"
    ></span>
    <span class="sr-only text-xs leading-tight text-texto sm:not-sr-only">{{ etiqueta() }}</span>
    @if (apariencia().cantidadEnChico) {
      <span class="text-xs font-semibold text-texto sm:hidden" aria-hidden="true">
        {{ dia().cantidad }}
      </span>
    }
  </div>
} @else {
  <span class="sr-only text-xs leading-tight text-texto-suave sm:not-sr-only sm:mt-1 sm:block">
    {{ mesDeRelleno() }}
  </span>
}
