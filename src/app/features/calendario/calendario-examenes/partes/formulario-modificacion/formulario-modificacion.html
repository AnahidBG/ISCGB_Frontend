<form
  [formGroup]="formulario"
  (ngSubmit)="alGuardar()"
  aria-label="Modificar parcial"
  class="flex flex-col gap-4"
  novalidate
>
  @if (errorServidor(); as mensaje) {
    <p
      role="alert"
      class="rounded-lg border border-rechazado/30 bg-rechazado/10 px-4 py-3 text-sm text-texto"
    >
      {{ mensaje }}
    </p>
  }

  <div class="grid gap-4 sm:grid-cols-2">
    <app-campo-formulario
      etiqueta="Fecha"
      idCampo="modificacion-fecha"
      [requerido]="true"
      [error]="errorFecha"
    >
      <!--
        `attr.min` y no `min`: es la ayuda nativa del navegador. La regla de verdad
        es `errorDeDia`, que también ataja una fecha escrita a mano.
      -->
      <input
        #campoFecha
        id="modificacion-fecha"
        type="date"
        formControlName="fecha"
        [attr.min]="fechaMinima()"
        [attr.aria-invalid]="errorFecha !== null"
        [attr.aria-describedby]="descripcionDe('modificacion-fecha', errorFecha)"
        [class]="clasesDe(errorFecha)"
      />
    </app-campo-formulario>

    <app-campo-formulario
      etiqueta="Horario"
      idCampo="modificacion-horario"
      [requerido]="true"
      [error]="errorHorario"
    >
      <input
        id="modificacion-horario"
        type="time"
        formControlName="horario"
        [attr.aria-invalid]="errorHorario !== null"
        [attr.aria-describedby]="
          descripcionDe('modificacion-horario', errorHorario, 'ayuda-modificacion-horario')
        "
        [class]="clasesDe(errorHorario)"
      />
      <span id="ayuda-modificacion-horario" class="text-xs text-texto-suave">
        Horario en formato 24 h.
      </span>
    </app-campo-formulario>
  </div>

  <!--
    La baja es la acción secundaria y destructiva: va aparte, a la izquierda, y no
    borra nada por sí sola (pide confirmación).
  -->
  <div class="mt-2 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <app-boton
      nivel="terciario"
      [conFlecha]="false"
      [deshabilitado]="guardando()"
      (click)="eliminar.emit()"
    >
      Eliminar parcial
    </app-boton>

    <div class="flex flex-col-reverse gap-3 sm:flex-row">
      <app-boton
        nivel="terciario"
        [conFlecha]="false"
        [deshabilitado]="guardando()"
        (click)="cancelar.emit()"
      >
        Cancelar
      </app-boton>
      <app-boton
        tipo="submit"
        [conFlecha]="false"
        [deshabilitado]="sinCambios"
        [cargando]="guardando()"
        textoCargando="Guardando…"
      >
        Guardar
      </app-boton>
    </div>
  </div>
</form>
