<ul class="flex flex-wrap gap-2" aria-label="Referencias de los colores">
  @for (item of items(); track item.estado) {
    <li
      class="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs font-medium text-texto"
      [class]="apariencia[item.estado].chip"
    >
      <span
        class="h-1.5 w-1.5 shrink-0 rounded-full"
        [class]="apariencia[item.estado].marca"
        aria-hidden="true"
      ></span>
      {{ item.etiqueta }}
    </li>
  }
</ul>
