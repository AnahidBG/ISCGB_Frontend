<div class="w-full rounded-lg border border-borde bg-fondo-panel p-3">
  <fieldset [attr.aria-describedby]="error() ? prefijoId() + '-error' : null">
    <legend class="text-xs font-medium text-texto-suave">
      Motivo del rechazo (lo va a ver la persona)
    </legend>

    <!-- Los textos salen de MOTIVOS_RECHAZO: no se repiten acá. -->
    <ul class="mt-2 flex flex-col gap-0.5">
      @for (motivo of motivos; track motivo; let indice = $index) {
        <li>
          <label
            [attr.for]="prefijoId() + '-motivo-' + indice"
            class="flex cursor-pointer items-start gap-2 rounded-md px-1.5 py-1.5 text-sm text-texto hover:bg-superficie"
          >
            <input
              type="checkbox"
              [id]="prefijoId() + '-motivo-' + indice"
              [checked]="elegidos().has(motivo)"
              (change)="alternar(motivo, $event)"
              class="mt-0.5 h-4 w-4 shrink-0 cursor-pointer rounded border-borde accent-rechazado"
            />
            <span>{{ motivo }}</span>
          </label>
        </li>
      }
    </ul>
  </fieldset>

  @if (error(); as mensaje) {
    <p [id]="prefijoId() + '-error'" role="alert" class="mt-1 text-xs text-rechazado">
      {{ mensaje }}
    </p>
  }

  <label
    [attr.for]="prefijoId() + '-aclaracion'"
    class="mt-3 block text-xs font-medium text-texto-suave"
  >
    Aclaración (opcional)
  </label>
  <textarea
    [id]="prefijoId() + '-aclaracion'"
    [value]="aclaracion()"
    (input)="aclaracion.set($any($event.target).value)"
    rows="2"
    class="mt-1 w-full resize-none rounded-md border border-borde bg-superficie px-2 py-1.5 text-sm text-texto focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-rechazado"
    placeholder="Ej: falta la hoja 2 del certificado."
  ></textarea>

  <div class="mt-2 flex justify-end gap-2">
    <button
      type="button"
      class="rounded-full px-3 py-1.5 text-xs text-texto-suave hover:text-texto"
      (click)="cancelar.emit()"
    >
      Cancelar
    </button>
    <button
      type="button"
      class="rounded-full bg-rechazado px-3 py-1.5 text-xs font-semibold text-white hover:brightness-90"
      (click)="intentarConfirmar()"
    >
      Confirmar rechazo
    </button>
  </div>
</div>
