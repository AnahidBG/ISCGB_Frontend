<app-estructura-panel
  [enlaces]="enlaces()"
  encabezado="titulo"
  [tituloPagina]="datos.titulo"
  [volverUrl]="rutaPanel()"
  [nombreUsuario]="sesion()?.nombreCompleto ?? ''"
  [emailUsuario]="sesion()?.email ?? ''"
  [rolPrincipal]="rolPrincipal()"
  (cerrarSesion)="cerrarSesion()"
>
  <div
    class="mx-auto max-w-xl rounded-2xl border border-dashed border-borde bg-superficie px-6 py-14 text-center sm:px-10"
  >
    <span
      class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-principal-suave text-principal"
    >
      <app-icono [nombre]="datos.icono" class="h-8 w-8" />
    </span>

    <h2 class="mt-5 text-xl font-bold text-principal">{{ datos.titulo }} — Próximamente</h2>
    <p class="mx-auto mt-2 max-w-md text-sm leading-relaxed text-texto-suave">
      {{ datos.descripcion }}
    </p>

    <span
      class="mt-5 inline-flex items-center gap-1.5 rounded-full bg-fondo-panel px-3.5 py-1.5 text-xs font-medium text-texto-suave"
    >
      <app-icono nombre="reloj" class="h-3.5 w-3.5" />
      Previsto para {{ datos.disponibleDesde }}
    </span>

    <p class="mx-auto mt-6 max-w-md text-xs leading-relaxed text-texto-suave">
      Esta pantalla adelanta lo que se viene: el backend todavía no tiene el endpoint que la
      sostiene. La vamos a completar de a poco — por ahora, sirve para ubicarla en el menú y
      probar la navegación.
    </p>
  </div>
</app-estructura-panel>
