<!--
  Escritorio (`lg`): dos columnas — el panel verde a la izquierda, el
  formulario a la derecha.

  Celular: una sola capa. El panel verde pasa a ser el FONDO a pantalla
  completa (`absolute inset-0`) y la card del formulario flota centrada
  encima (`z-10`). El panel se encarga de desenfocar su foto y esconder su
  texto para que no compita con la card — ver panel-bienvenida.html.
-->
<main class="relative min-h-dvh bg-fondo lg:grid lg:grid-cols-2">
  <!--
    El tema se elige acá, en la esquina: el login es lo primero que se ve, antes
    de entrar a ningún menú, y quien prefiere el modo oscuro no tiene por qué
    ingresar para poder activarlo. Es el botón de un solo toque; las tres
    opciones (con "Automático") están en el menú de la persona y en Configuración.
    `z-20` lo deja por encima de la tarjeta del formulario, que es `z-10`.
  -->
  <div class="absolute top-4 right-4 z-20 sm:top-6 sm:right-6">
    <app-selector-tema variante="boton" />
  </div>

  <div class="absolute inset-0 lg:relative lg:block">
    <app-panel-bienvenida />
  </div>

  <div class="relative z-10 flex min-h-dvh items-center justify-center px-6 py-12 lg:min-h-0">
    <div class="w-full max-w-md rounded-3xl bg-superficie p-8 shadow-xl sm:p-10 lg:shadow-sm">
      @if (sesionVencida() && error() === null) {
        <p
          role="status"
          class="mb-6 rounded-lg border-l-4 border-pendiente bg-pendiente/10 px-4 py-3 text-sm text-texto"
        >
          <strong>Tu sesión venció.</strong>
          Por seguridad dura 2 horas: volvé a ingresar con tu DNI y contraseña.
        </p>
      }

      <app-formulario-login
        [cargando]="cargando()"
        [errorGeneral]="error()"
        (enviar)="iniciarSesion($event)"
      />

      <!--
        "Solicitar acceso" quedó fuera del MVP: no hay endpoint, no hay tabla
        y no figura en ningún sprint. El diseño está guardado en Figma para
        una versión futura. Ver docs/alcance-login.md
      -->

      <p class="mt-8 text-center text-xs text-texto-suave">
        Sistema de Autenticación de Usuarios de ISCGB
      </p>
    </div>
  </div>
</main>
