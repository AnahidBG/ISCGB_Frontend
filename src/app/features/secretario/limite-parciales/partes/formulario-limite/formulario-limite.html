<form
  [formGroup]="formulario"
  (ngSubmit)="alGuardar()"
  [attr.aria-label]="'Límite de parciales por ' + periodo"
  class="flex max-w-2xl flex-col gap-5 rounded-2xl border border-borde bg-superficie px-5 py-5 sm:px-6 sm:py-6"
  novalidate
>
  <!-- `status` y no `alert`: confirma algo que la persona acaba de hacer, no la interrumpe. -->
  @if (confirmacion(); as mensaje) {
    <p
      role="status"
      class="rounded-lg border border-aprobado/30 bg-aprobado/10 px-4 py-3 text-sm text-texto"
    >
      {{ mensaje }}
    </p>
  }

  @if (errorServidor(); as mensaje) {
    <p
      role="alert"
      class="rounded-lg border border-rechazado/30 bg-rechazado/10 px-4 py-3 text-sm text-texto"
    >
      {{ mensaje }}
    </p>
  }

  <app-campo-formulario
    [etiqueta]="'Parciales por ' + periodo"
    idCampo="limite-diario"
    [requerido]="true"
    [error]="errorLimite"
  >
    <!--
      `attr.min` / `attr.max` y no `min` / `max`: son la ayuda nativa del
      navegador (flechitas, teclado numérico). Como propiedad sumarían los
      validadores de Angular arriba del nuestro, con otra regla.
    -->
    <input
      id="limite-diario"
      type="number"
      formControlName="limite"
      inputmode="numeric"
      step="1"
      [attr.min]="minimo"
      [attr.max]="maximo"
      [attr.aria-invalid]="errorLimite !== null"
      [attr.aria-describedby]="errorLimite ? 'ayuda-limite limite-diario-error' : 'ayuda-limite'"
      [class.border-rechazado]="errorLimite !== null"
      [class.border-borde]="errorLimite === null"
      class="w-full max-w-40 rounded-lg border bg-superficie px-4 py-3 text-texto hover:border-acento-verde focus:border-principal focus:ring-2 focus:ring-principal/20 focus:outline-none"
    />
  </app-campo-formulario>

  <p id="ayuda-limite" class="text-xs leading-relaxed text-texto-suave">
    Vale para todo el instituto y para todos los tipos de examen. Al alcanzar el límite por
    {{ periodo }}, el calendario muestra el día como Completo y no admite más fechas.
  </p>

  <div>
    <app-boton
      tipo="submit"
      [conFlecha]="false"
      [cargando]="guardando()"
      textoCargando="Guardando…"
      [deshabilitado]="sinCambios"
    >
      Guardar
    </app-boton>
  </div>
</form>
